<div class="text-white">
  <div class="flex">
    <app-sidebar></app-sidebar>
    <main class="flex-col w-full">
      <app-header></app-header>

      <router-outlet></router-outlet>
    </main>
  </div>
</div>

@if (authUi.isLoginOpen() || authUi.isRegisterOpen()) {
  <!-- Overlay con blur -->
  <div
    class="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm transition-opacity"
    (click)="authUi.isLoginOpen() ? authUi.closeLogin() : authUi.closeRegister()">
  </div>

  <!-- Contenedor centrado que NO cierra al hacer click dentro -->
  <div class="fixed inset-0 z-50 grid place-items-center p-4">
    <div class="pointer-events-auto" (click)="$event.stopPropagation()" role="dialog" aria-modal="true">
      @if (authUi.isLoginOpen())    { <app-login    class="block"></app-login> }
      @if (authUi.isRegisterOpen()) { <app-register class="block"></app-register> }
    </div>
  </div>
}
