<div class="min-h-screen text-orange-500 p-6">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
    <h1 class="text-3xl font-bold text-orange-500">Admin Dashboard</h1>
    <div class="flex items-center gap-4">
      <span class="text-gray-300 text-xl">Welcome, {{ authService.user()?.name }}</span>
      <button (click)="authService.logout().subscribe()" routerLink="/"
        class="px-4 py-2 border border-orange-500 hover:text-gray-300 text-orange-500 rounded-lg transition-colors">Logout</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="border-b border-gray-700 mb-8">
    <div class="flex flex-wrap gap-2">
      <button class="px-4 py-2 border-b-2 transition-colors"
              [class]="activeTab()==='users' ? 'border-orange-500 text-orange-400' : 'border-transparent text-gray-400 hover:text-orange-300'"
              (click)="setTab('users')">Users</button>
      <button class="px-4 py-2 border-b-2 transition-colors"
              [class]="activeTab()==='content' ? 'border-orange-500 text-orange-400' : 'border-transparent text-gray-400 hover:text-orange-300'"
              (click)="setTab('content')">Content</button>
      <button class="px-4 py-2 border-b-2 transition-colors"
              [class]="activeTab()==='plans' ? 'border-orange-500 text-orange-400' : 'border-transparent text-gray-400 hover:text-orange-300'"
              (click)="setTab('plans')">Plans</button>
      <button class="px-4 py-2 border-b-2 transition-colors"
              [class]="activeTab()==='subscriptions' ? 'border-orange-500 text-orange-400' : 'border-transparent text-gray-400 hover:text-orange-300'"
              (click)="setTab('subscriptions')">Subscriptions</button>
      <button class="px-4 py-2 border-b-2 transition-colors"
              [class]="activeTab()==='payments' ? 'border-orange-500 text-orange-400' : 'border-transparent text-gray-400 hover:text-orange-300'"
              (click)="setTab('payments')">Payments</button>
      <button class="px-4 py-2 border-b-2 transition-colors"
              [class]="activeTab()==='profiles' ? 'border-orange-500 text-orange-400' : 'border-transparent text-gray-400 hover:text-orange-300'"
              (click)="setTab('profiles')">Profiles</button>
      <button class="px-4 py-2 border-b-2 transition-colors"
              [class]="activeTab()==='watchlists' ? 'border-orange-500 text-orange-400' : 'border-transparent text-gray-400 hover:text-orange-300'"
              (click)="setTab('watchlists')">watchlists</button>
      <button class="px-4 py-2 border-b-2 transition-colors"
              [class]="activeTab()==='episodes' ? 'border-orange-500 text-orange-400' : 'border-transparent text-gray-400 hover:text-orange-300'"
              (click)="setTab('episodes')">episodes</button>
      <button class="px-4 py-2 border-b-2 transition-colors"
              [class]="activeTab()==='playbacks' ? 'border-orange-500 text-orange-400' : 'border-transparent text-gray-400 hover:text-orange-300'"
              (click)="setTab('playbacks')">playbacks</button>
    </div>
  </div>

  <!-- Body -->
  @switch (activeTab()) {
    @case ('users') { <app-users-tab /> }
    @case ('content') { <app-content-tab /> }
    @case ('plans') { <app-plans-tab /> }
    @case ('subscriptions') { <app-subscriptions-tab /> }
    @case ('payments') { <app-payments-tab /> }
    @case ('profiles') { <app-profiles-tab /> }
    @case ('watchlists') { <app-watchlists-tab /> }
    @case ('episodes') { <app-episodes-tab/> }
    @case ('playbacks') { <app-playbacks-tab/> }
  }
</div>
