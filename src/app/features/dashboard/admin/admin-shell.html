<div class="min-h-screen text-orange-500 px-4 pt-4">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
    <h1 class="text-3xl font-bold text-orange-500">Admin Dashboard</h1>
  </div>

  <!-- Tabs -->
  <div class="border-b border-gray-700 mb-8">
    <nav class="flex flex-wrap gap-2">
      <a class="px-4 py-2 border-b-2 transition-colors border-transparent text-gray-400 hover:text-orange-300"
         routerLink="/dashboard/admin/users"
         routerLinkActive="border-orange-500 text-orange-400"
         [routerLinkActiveOptions]="{ exact: true }">Users</a>

      <a class="px-4 py-2 border-b-2 transition-colors border-transparent text-gray-400 hover:text-orange-300"
         routerLink="/dashboard/admin/content"
         routerLinkActive="border-orange-500 text-orange-400"
         [routerLinkActiveOptions]="{ exact: true }">Content</a>

      <a class="px-4 py-2 border-b-2 transition-colors border-transparent text-gray-400 hover:text-orange-300"
         routerLink="/dashboard/admin/plans"
         routerLinkActive="border-orange-500 text-orange-400"
         [routerLinkActiveOptions]="{ exact: true }">Plans</a>

      <a class="px-4 py-2 border-b-2 transition-colors border-transparent text-gray-400 hover:text-orange-300"
         routerLink="/dashboard/admin/subscriptions"
         routerLinkActive="border-orange-500 text-orange-400"
         [routerLinkActiveOptions]="{ exact: true }">Subscriptions</a>

      <a class="px-4 py-2 border-b-2 transition-colors border-transparent text-gray-400 hover:text-orange-300"
         routerLink="/dashboard/admin/payments"
         routerLinkActive="border-orange-500 text-orange-400"
         [routerLinkActiveOptions]="{ exact: true }">Payments</a>

      <a class="px-4 py-2 border-b-2 transition-colors border-transparent text-gray-400 hover:text-orange-300"
         routerLink="/dashboard/admin/profiles"
         routerLinkActive="border-orange-500 text-orange-400"
         [routerLinkActiveOptions]="{ exact: true }">Profiles</a>

      <a class="px-4 py-2 border-b-2 transition-colors border-transparent text-gray-400 hover:text-orange-300"
         routerLink="/dashboard/admin/watchlists"
         routerLinkActive="border-orange-500 text-orange-400"
         [routerLinkActiveOptions]="{ exact: true }">Watchlists</a>

      <a class="px-4 py-2 border-b-2 transition-colors border-transparent text-gray-400 hover:text-orange-300"
         routerLink="/dashboard/admin/episodes"
         routerLinkActive="border-orange-500 text-orange-400"
         [routerLinkActiveOptions]="{ exact: true }">Episodes</a>

      <a class="px-4 py-2 border-b-2 transition-colors border-transparent text-gray-400 hover:text-orange-300"
         routerLink="/dashboard/admin/playbacks"
         routerLinkActive="border-orange-500 text-orange-400"
         [routerLinkActiveOptions]="{ exact: true }">Playbacks</a>
    </nav>
  </div>

  <!-- Body -->
  <router-outlet></router-outlet>
</div>
