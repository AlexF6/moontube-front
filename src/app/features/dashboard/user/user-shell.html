<div class="min-h-screen text-orange-500 p-6">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
    <h1 class="text-3xl font-bold text-orange-500">My Account</h1>
  </div>

  <!-- Tabs -->
  <div class="border-b border-gray-700 mb-8">
    <div class="flex flex-wrap gap-2">
      <a class="px-4 py-2 border-b-2 transition-colors border-transparent text-gray-400 hover:text-orange-300"
         routerLink="/dashboard/user/account"
         routerLinkActive="border-orange-500 text-orange-400"
         [routerLinkActiveOptions]="{ exact: true }">Account</a>

      <a class="px-4 py-2 border-b-2 transition-colors border-transparent text-gray-400 hover:text-orange-300"
         routerLink="/dashboard/user/payments"
         routerLinkActive="border-orange-500 text-orange-400"
         [routerLinkActiveOptions]="{ exact: true }">Payment History</a>

      <a class="px-4 py-2 border-b-2 transition-colors border-transparent text-gray-400 hover:text-orange-300"
         routerLink="/dashboard/user/profiles"
         routerLinkActive="border-orange-500 text-orange-400"
         [routerLinkActiveOptions]="{ exact: true }">Profiles</a>

      <a class="px-4 py-2 border-b-2 transition-colors border-transparent text-gray-400 hover:text-orange-300"
         routerLink="/dashboard/user/playbacks"
         routerLinkActive="border-orange-500 text-orange-400"
         [routerLinkActiveOptions]="{ exact: true }">Viewing History</a>
    </div>
  </div>

  <!-- Body -->
  <router-outlet></router-outlet>
</div>
