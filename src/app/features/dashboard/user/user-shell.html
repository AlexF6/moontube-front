<div class="min-h-screen text-orange-500 p-6">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
    <h1 class="text-3xl font-bold text-orange-500">My Account</h1>
  </div>

  <!-- Tabs -->
  <div class="border-b border-gray-700 mb-8">
    <div class="flex flex-wrap gap-2">
      <!-- <button class="px-4 py-2 border-b-2 transition-colors"
              [class]="activeTab()==='subscriptions' ? 'border-orange-500 text-orange-400' : 'border-transparent text-gray-400 hover:text-orange-300'"
              (click)="setTab('subscriptions')">My Subscriptions</button> -->
      <button class="px-4 py-2 border-b-2 transition-colors"
              [class]="activeTab()==='payments' ? 'border-orange-500 text-orange-400' : 'border-transparent text-gray-400 hover:text-orange-300'"
              (click)="setTab('payments')">Payment History</button>
      <button class="px-4 py-2 border-b-2 transition-colors"
              [class]="activeTab()==='profiles' ? 'border-orange-500 text-orange-400' : 'border-transparent text-gray-400 hover:text-orange-300'"
              (click)="setTab('profiles')">Profiles</button>
      <!-- <button class="px-4 py-2 border-b-2 transition-colors"
              [class]="activeTab()==='watchlists' ? 'border-orange-500 text-orange-400' : 'border-transparent text-gray-400 hover:text-orange-300'"
              (click)="setTab('watchlists')">My Watchlist</button> -->
      <button class="px-4 py-2 border-b-2 transition-colors"
              [class]="activeTab()==='playbacks' ? 'border-orange-500 text-orange-400' : 'border-transparent text-gray-400 hover:text-orange-300'"
              (click)="setTab('playbacks')">Viewing History</button>
    </div>
  </div>

  <!-- Body -->
  @switch (activeTab()) {
    @case ('payments') { <app-payments-tab /> }
    <!-- @case ('subscriptions') { <app-subscriptions-tab /> } -->
    @case ('profiles') { <app-profiles-tab /> }
    <!-- @case ('watchlists') { <app-watchlists-tab /> } -->
    @case ('playbacks') { <app-playbacks-tab /> }
  }
</div>
