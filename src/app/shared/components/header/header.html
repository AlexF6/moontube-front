<!-- src/app/shared/components/header/header.html -->

@if (ui.isSidebarOpen()) {
  <div 
    class="fixed inset-0 bg-black/60 z-40 md:hidden transition-opacity duration-200 ease-in-out" 
    (click)="ui.close()"
    [class]="ui.isSidebarOpen() ? 'opacity-100' : 'opacity-0 pointer-events-none'">
  </div>
}

<header class="sticky top-0 z-50 backdrop-blur-lg bg-black/90 border-b border-zinc-800/80 shadow-lg">
  <div class="flex items-center justify-between gap-4 px-4 py-3">
    <button 
      class="md:hidden p-2.5 rounded-xl border border-zinc-600 hover:border-orange-500 hover:bg-orange-500/10 transition-all duration-200 active:scale-95"
      (click)="ui.toggle()" 
      aria-label="Toggle sidebar"
      [attr.aria-expanded]="ui.isSidebarOpen()">
      <svg class="w-6 h-6 text-zinc-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <div class="relative flex-1 max-w-2xl mx-4">
      <input
        type="text"
        placeholder="Search videos..."
        class="w-full bg-zinc-900/80 border border-zinc-600 rounded-2xl py-2.5 pl-5 pr-12
               text-zinc-100 placeholder-zinc-400 
               focus:outline-none focus:ring-2 focus:ring-orange-500/50 focus:border-orange-500
               transition-all duration-200
               hover:border-zinc-500"
        [value]="query"
        (input)="onInput($event)"
        (keyup.enter)="onSearch()"
        aria-label="Search videos"
      />
      
      @if (query) {
        <button
          type="button"
          class="absolute right-10 top-1/2 -translate-y-1/2 p-1.5 text-zinc-400 hover:text-zinc-200 transition-colors"
          (click)="clearSearch()"
          aria-label="Clear search">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      }
      
      <button
        type="button"
        class="absolute right-2 top-1/2 -translate-y-1/2 p-2 text-zinc-400 hover:text-orange-500 transition-colors"
        (click)="onSearch()"
        aria-label="Search">
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor">
          <path d="M792-120.67 532.67-380q-30 25.33-69.64 39.67Q423.39-326 378.67-326q-108.44 0-183.56-75.17Q120-476.33 120-583.33t75.17-182.17q75.16-75.17 182.5-75.17 107.33 0 182.16 75.17 74.84 75.17 74.84 182.27 0 43.23-14 82.9-14 39.66-40.67 73l260 258.66-48 48Zm-414-272q79.17 0 134.58-55.83Q568-504.33 568-583.33q0-79-55.42-134.84Q457.17-774 378-774q-79.72 0-135.53 55.83-55.8 55.84-55.8 134.84t55.8 134.83q55.81 55.83 135.53 55.83Z"/>
        </svg>
      </button>
    </div>

    <div class="flex items-center space-x-4 text-md min-w-0">
      <!-- Rest of the user auth section remains the same -->
      @if (auth.isLoading()) {
        <div class="flex items-center gap-2 text-zinc-400">
          <div class="w-4 h-4 border-2 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
          <span class="text-sm">Checking session...</span>
        </div>
      } @else {
        @if (auth.user(); as u) {
          <div class="flex items-center gap-3">
            <span class="hidden sm:block text-zinc-200 font-medium truncate max-w-32 lg:max-w-48">
              Hi, {{ u.name || u.email }}
            </span>
            <button
              (click)="logout()"
              class="py-2.5 px-4 font-medium rounded-xl border border-orange-500 text-orange-500 
                     hover:bg-orange-500 hover:text-white transition-all duration-200 
                     active:scale-95 focus:ring-2 focus:ring-orange-500/50">
              Logout
            </button>
          </div>
        } @else {
          <div class="flex items-center gap-2">
            <button
              (click)="authUi.openLogin()"
              class="py-2.5 px-4 font-medium rounded-xl border border-orange-500 text-orange-500 
                     hover:bg-orange-500 hover:text-white transition-all duration-200 
                     active:scale-95 focus:ring-2 focus:ring-orange-500/50">
              Login
            </button>
            <button
              (click)="authUi.openRegister()"
              class="py-2.5 px-4 font-medium rounded-xl bg-orange-500 text-white 
                     hover:bg-orange-600 transition-all duration-200 
                     active:scale-95 focus:ring-2 focus:ring-orange-500/50">
              Signup
            </button>
          </div>
        }
      }
    </div>
  </div>
</header>
