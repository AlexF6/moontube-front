@if (ui.isSidebarOpen()) {
  <div
    class="fixed inset-0 bg-black/50 z-40 md:hidden transition-opacity duration-500 overflow-hidden"
    (click)="ui.close()">
  </div>
}

<aside
  role="navigation"
  aria-label="Main"
  class="fixed md:static top-0 left-0 z-50 w-[280px] h-full md:h-auto
         bg-black transition-transform duration-300
         flex flex-col px-4 py-[28px] relative"
  [class.-translate-x-full]="!ui.isSidebarOpen() && !isDesktop"
  [class.translate-x-0]="ui.isSidebarOpen() || isDesktop"

  [attr.inert]="blockSidebar() ? '' : null"
  [attr.aria-busy]="blockSidebar() ? 'true' : null"
  [class.opacity-60]="blockSidebar()"
  [class.select-none]="blockSidebar()">

  @if (blockSidebar()) {
    <div class="absolute inset-0 z-50 bg-black/40 backdrop-blur-[2px] flex items-center justify-center">
      <div class="flex flex-col items-center gap-3 text-orange-300">
        <svg class="animate-spin h-6 w-6" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity=".25" stroke-width="4"></circle>
          <path d="M22 12a10 10 0 0 1-10 10" stroke="currentColor" stroke-width="4"></path>
        </svg>
        <span class="text-sm">Cargando sesión y perfiles…</span>
      </div>
    </div>
  }

  <div data-slot="sidebar-header" class="flex text-center items-center justify-center">
    <span class="text-2xl font-bold text-orange-400 tracking-widest pb-4">MOONTUBE</span>
  </div>

  <ul data-slot="sidebar-menu" class="flex flex-col gap-1 p-2">

    <!-- Home (active only on exact "/") -->
    <li data-slot="sidebar-menu-item" class="group/menu-item">
      <a
        [routerLink]="['/']"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        [attr.aria-current]="isActiveExact('/') ? 'page' : null"
        class="flex items-center gap-2 p-3 w-full rounded-lg text-white/80 text-lg font-semibold
               transition-colors duration-300 border border-transparent hover:bg-orange-500/60 relative"
        [class.ring-1]="isActiveExact('/')"
        [class.ring-orange-500]="isActiveExact('/')"
        [class.bg-orange-500/10]="isActiveExact('/')"
        [class.text-orange-300]="isActiveExact('/')"
        [class.border-orange-400]="isActiveExact('/')">
        <span class="absolute left-0 top-0 bottom-0 w-1 rounded-r"
              [class.bg-orange-500]="isActiveExact('/')"></span>
        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M220-180h150v-250h220v250h150v-390L480-765 220-570v390Zm-60 60v-480l320-240 320 240v480H530v-250H430v250H160Zm320-353Z"/></svg>
        Home
      </a>
    </li>

    <!-- Dashboard (admin or user). Uses button + programmatic nav; style as active when URL starts with /dashboard -->
    <li data-slot="sidebar-menu-item" class="group/menu-item">
      <button
        (click)="navigateToDashboard()"
        [disabled]="blockSidebar()"
        [attr.aria-current]="isActiveStartsWith('/dashboard') ? 'page' : null"
        class="flex items-center gap-2 p-3 w-full rounded-lg text-white/80 text-lg font-semibold
               transition-colors duration-300 border border-transparent hover:bg-orange-500/60 relative"
        [class.ring-1]="isActiveStartsWith('/dashboard')"
        [class.ring-orange-500]="isActiveStartsWith('/dashboard')"
        [class.bg-orange-500/10]="isActiveStartsWith('/dashboard')"
        [class.text-orange-300]="isActiveStartsWith('/dashboard')"
        [class.border-orange-400]="isActiveStartsWith('/dashboard')">
        <span class="absolute left-0 top-0 bottom-0 w-1 rounded-r"
              [class.bg-orange-500]="isActiveStartsWith('/dashboard')"></span>
        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M510-570v-270h330v270H510ZM120-450v-390h330v390H120Zm390 330v-390h330v390H510Zm-390 0v-270h330v270H120Zm60-390h210v-270H180v270Zm390 330h210v-270H570v270Zm0-450h210v-150H570v150ZM180-180h210v-150H180v150Zm210-330Zm180-120Zm0 180ZM390-330Z"/></svg>
        Dashboard
      </button>
    </li>

    <!-- My Watchlist -->
    <li data-slot="sidebar-menu-item" class="group/menu-item">
      <button
        (click)="navigateToWatchlist()"
        [disabled]="blockSidebar()"
        [attr.aria-current]="isActiveStartsWith('/watchlists') ? 'page' : null"
        class="flex items-center gap-2 p-3 w-full rounded-lg text-white/80 text-lg font-semibold
               transition-colors duration-300 border border-transparent hover:bg-orange-500/60 relative"
        [class.ring-1]="isActiveStartsWith('/watchlists')"
        [class.ring-orange-500]="isActiveStartsWith('/watchlists')"
        [class.bg-orange-500/10]="isActiveStartsWith('/watchlists')"
        [class.text-orange-300]="isActiveStartsWith('/watchlists')"
        [class.border-orange-400]="isActiveStartsWith('/watchlists')">
        <span class="absolute left-0 top-0 bottom-0 w-1 rounded-r"
              [class.bg-orange-500]="isActiveStartsWith('/watchlists')"></span>
        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor">
          <path d="M80-160v-60h800v60H80Zm89-160v-316h60v316h-60Zm159 0v-480h60v480h-60Zm159 0v-480h60v480h-60Zm275 0L597-600l54-30 162 280-51 30Z"/>
        </svg>
        <span>My Watchlist</span>
      </button>
    </li>

    <!-- Subscriptions -->
    <li data-slot="sidebar-menu-item" class="group/menu-item">
      <button
        (click)="navigateToSubscriptions()"
        [disabled]="blockSidebar()"
        [attr.aria-current]="isActiveStartsWith('/subscriptions') ? 'page' : null"
        class="flex items-center gap-2 p-3 w-full rounded-lg text-white/80 text-lg font-semibold
               transition-colors duration-300 border border-transparent hover:bg-orange-500/60 relative"
        [class.ring-1]="isActiveStartsWith('/subscriptions')"
        [class.ring-orange-500]="isActiveStartsWith('/subscriptions')"
        [class.bg-orange-500/10]="isActiveStartsWith('/subscriptions')"
        [class.text-orange-300]="isActiveStartsWith('/subscriptions')"
        [class.border-orange-400]="isActiveStartsWith('/subscriptions')">
        <span class="absolute left-0 top-0 bottom-0 w-1 rounded-r"
              [class.bg-orange-500]="isActiveStartsWith('/subscriptions')"></span>
        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg"
             viewBox="0 -960 960 960" fill="currentColor">
          <path d="M140-80q-24 0-42-18t-18-42v-440q0-24 18-42t42-18h680q24 0 42 18t18 42v440q0 24-18 42t-42 18H140Zm0-60h680v-440H140v440Zm267-71 221-149-221-148v297ZM149-700v-60h662v60H149Zm131-120v-60h400v60H280ZM140-140v-440 440Z"/>
        </svg>
        <span>Subscriptions</span>
      </button>
    </li>

    <!-- Plans (Public route - direct navigation) -->
    <li data-slot="sidebar-menu-item" class="group/menu-item">
      <a
        [routerLink]="['/plans']"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        [attr.aria-current]="isActiveExact('/plans') ? 'page' : null"
        class="flex items-center gap-2 p-3 w-full rounded-lg text-white/80 text-lg font-semibold
               transition-colors duration-300 border border-transparent hover:bg-orange-500/60 relative"
        [class.ring-1]="isActiveExact('/plans')"
        [class.ring-orange-500]="isActiveExact('/plans')"
        [class.bg-orange-500/10]="isActiveExact('/plans')"
        [class.text-orange-300]="isActiveExact('/plans')"
        [class.border-orange-400]="isActiveExact('/plans')">
        <span class="absolute left-0 top-0 bottom-0 w-1 rounded-r"
              [class.bg-orange-500]="isActiveExact('/plans')"></span>
        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
          <path d="M240-280h280v-80H240v80Zm400 0h80v-400h-80v400ZM240-440h280v-80H240v80Zm0-160h280v-80H240v80Zm-80 480q-33 0-56.5-23.5T80-200v-560q0-33 23.5-56.5T160-840h640q33 0 56.5 23.5T880-760v560q0 33-23.5 56.5T800-120H160Zm0-80h640v-560H160v560Zm0 0v-560 560Z"/>
        </svg>
        <span>Plans</span>
      </a>
    </li>
  </ul>
</aside>
